# /etc/httpd/conf.d/switchboard.conf
# Publica o switchboard em https://<IP-publico>:8443 usando o Apache que já roda no Issabel.
# O Node fica escutando só em 127.0.0.1:8080 (HOST=127.0.0.1 no .env).

Listen 8443 https

<VirtualHost *:8443>
    SSLEngine on
    # Certificado autoassinado gerado para o IP público (passo 6 do README)
    SSLCertificateFile /etc/pki/tls/certs/switchboard.crt
    SSLCertificateKeyFile /etc/pki/tls/private/switchboard.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # WebSocket (atualização em tempo real do painel)
    ProxyPass        /ws ws://127.0.0.1:8080/ws
    ProxyPass        /   http://127.0.0.1:8080/
    ProxyPassReverse /   http://127.0.0.1:8080/
</VirtualHost>
